[project]
name = "amdl"
version = "1.0.0"
description = "download apple music meow"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "keyring>=25.7.0",
    "m3u8>=6.0.0",
    "mutagen>=1.48.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pywidevine>=1.9.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
amdl = "amdl.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "mypy @ git+https://github.com/python/mypy.git@7f88c95bbf9af181a4de13e2c242c89216f15b19",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "tuna>=0.5.15",
    "types-m3u8>=6.0.0.20260518",
]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "D",
    "missing-copyright-notice",
    "raw-string-in-exception",
    "raise-vanilla-args",
    "docstring-missing-returns",
    "missing-trailing-comma",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "assert",
    "import-private-name",
    "private-member-access",
    "too-many-public-methods",
]
"dev/*.py" = ["implicit-namespace-package"]
"src/amdl/media/downloader.py" = [
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
"src/amdl/domain.py" = [
    "typing-only-standard-library-import"
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
